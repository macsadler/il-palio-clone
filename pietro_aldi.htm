<FONT size="5pt">Nato nel 1852 a Manciano (GR) e morto nel 1888, è ricordato a Siena per aver disegnato
il Palio del 16 luglio 1887, al quale assistettero i Reali.<br>
Così veniva descritto dal periodico <b>Mira! Mira!</b> del 12 luglio 1885.<br><br>
